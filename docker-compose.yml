name: ${APP_NAME:-ieee-ihu-serres-summary}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"
    compress: "true"

services:
  site:
    image: ${IMAGE:?IMAGE is required}:${IMAGE_TAG:?IMAGE_TAG is required}
    container_name: ${APP_NAME:-ieee-ihu-serres-summary}
    restart: unless-stopped
    # Static site on the official httpd image: Apache starts as root, binds
    # port 80, then serves through unprivileged child processes. Everything is
    # read-only except Apache's runtime directory (PID file etc.).
    read_only: true
    tmpfs:
      - /usr/local/apache2/logs
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE # listen on port 80
      - SETUID           # start children as the unprivileged user
      - SETGID
      - KILL             # signal those children on graceful restart/stop
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: "${TZ:-Europe/Athens}"
    networks:
      - site
    healthcheck:
      # The Debian-based httpd image has no curl/wget; bash can still make the request.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/80 && printf 'GET / HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      start_interval: 2s
    logging: *default-logging
    deploy:
      resources:
        limits:
          # noinspection ComposeUnknownValues
          cpus: "${SITE_CPU_LIMIT:-0.5}"
          # noinspection ComposeUnknownValues
          memory: "${SITE_MEMORY_LIMIT:-128M}"
          # noinspection ComposeUnknownValues
          pids: ${SITE_PIDS_LIMIT:-128}
        reservations:
          # noinspection ComposeUnknownValues
          memory: "${SITE_MEMORY_RESERVATION:-32M}"
    labels:
      - "traefik.enable=true"
      # Router
      - "traefik.http.routers.${APP_NAME:-ieee-ihu-serres-summary}.rule=Host(`${DOMAIN:?DOMAIN is required}`)"
      - "traefik.http.routers.${APP_NAME:-ieee-ihu-serres-summary}.entrypoints=websecure"
      - "traefik.http.routers.${APP_NAME:-ieee-ihu-serres-summary}.service=${APP_NAME:-ieee-ihu-serres-summary}"
      # Public site: no IP allowlist. A static site needs no encoded characters.
      - "traefik.http.routers.${APP_NAME:-ieee-ihu-serres-summary}.middlewares=strict-path@file"
      # Service
      - "traefik.http.services.${APP_NAME:-ieee-ihu-serres-summary}.loadbalancer.server.port=80"

networks:
  site:
    name: ${APP_NAME:-ieee-ihu-serres-summary}